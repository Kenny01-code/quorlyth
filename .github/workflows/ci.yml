name: Quorlyth CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quorlyth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/quorlyth-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('/tmp/quorlyth-audit.json', 'utf8'))
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = item.via.map(entry => typeof entry === 'string'
              ? entry
              : { title: entry.title, url: entry.url, range: entry.range, source: entry.source })
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }))
          }
          NODE
      - name: Validate the versioned AI corpus
        run: npm run ai:data:validate
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
