name: Quorlyth CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quorlyth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates to vulnerable dependencies
        run: |
          npm pkg set 'devDependencies.vite=^6.4.5' 'overrides.dompurify=^3.4.17'
          npm audit fix
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/quorlyth-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('/tmp/quorlyth-audit.json', 'utf8'))
          const summary = report.metadata?.vulnerabilities ?? {}
          console.log('Dependency audit summary:', JSON.stringify(summary))
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = item.via.map(entry => typeof entry === 'string'
              ? entry
              : { title: entry.title, url: entry.url, range: entry.range, source: entry.source })
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }))
          }
          if ((summary.total ?? 0) > 0) process.exitCode = 1
          NODE
      - name: Validate the versioned AI corpus
        run: npm run ai:data:validate
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit patched dependency lockfile to this hardening branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/track-active-day-invoker-and-npm-audit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lock changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: patch vulnerable npm dependencies"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.extraheader="$AUTH_HEADER" fetch origin "refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git -c http.extraheader="$AUTH_HEADER" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
